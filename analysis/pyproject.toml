[project]
name = "tfl-faster-on-foot-analysis"
version = "0.1.0"
description = "Spatial & network graph analysis of TfL walking vs. rail travel times for the Imperial College London Data Observatory"
readme = "FINDINGS.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pyproj>=3.7.0",
    "pyshp>=2.3.1",
    "requests>=2.32.0"
]
